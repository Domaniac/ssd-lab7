name: ESLint Code Analysis

on: [push, pull_request]

jobs:
  eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Ensure this matches your local Node.js version

      - name: Debug: List files before dependency cleanup
        run: ls -la #

      - name: Clean node_modules and old config files
        run: |
          echo "Cleaning up node_modules and old config files..."
          rm -rf node_modules # Force remove node_modules
          rm -f .eslintrc.cjs
          rm -f .eslintrc.js
          rm -f eslint.config.mjs
          echo "Cleanup complete."

      - name: Debug: List files after cleanup
        run: ls -la # Verify node_modules is gone

      - name: Install Node.js dependencies
        # Use npm ci for clean installs based on package-lock.json
        run: npm ci # This is more reliable in CI/CD than npm install
        env:
          CI: true # Tell npm to behave like in a CI environment

      - name: Debug: List installed npm packages and versions
        run: npm list eslint eslint-plugin-react @eslint/js globals @microsoft/eslint-formatter-sarif eslint-plugin-security || true # List specific packages to confirm versions and presence. || true to prevent failure if not found.

      - name: Debug: Check ESLint version explicitly
        run: npx eslint --version

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run ESLint with SARIF output
        # Assuming eslint.config.js is at the root and correctly configured.
        # If you are using .eslintrc.cjs, you MUST add --config .eslintrc.cjs here.
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file reports/eslint-results.sarif

      - name: Debug ESLint Output
        run: cat reports/eslint-results.sarif || echo "No SARIF report generated (ESLint step failed or didn't create it)"

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/eslint-results.sarif